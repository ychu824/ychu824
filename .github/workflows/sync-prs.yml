name: Sync PR lists

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 05:17 Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate PR tables
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_prs.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync PR lists"
          git push
